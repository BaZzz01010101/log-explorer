appId: dev.awslogexplorer.desktop
productName: AWS Log Explorer
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
